name: Deployment helper tests

on:
  push:
  pull_request:

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check notebook files without executing them
        run: python tools/check_notebooks.py
      - name: Check local Markdown links
        run: python tools/check_markdown_links.py
      - name: Test notebook checker
        run: python -m unittest discover -s tools/tests -v
      - name: Run dependency-free tests
        working-directory: deploy
        run: python -m unittest discover -s tests -v
